[workspace]
resolver = "3"
members = ["crates/floww-core", "crates/floww-engine", "crates/floww-server", "src-tauri"]

[workspace.package]
version = "0.1.6"
edition = "2024"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
