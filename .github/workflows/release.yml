name: Release

# Push a tag like v0.1.0, or run it by hand with a tag name, to build the Linux
# packages and publish a GitHub release. Run by hand, it creates the tag on the
# commit it builds.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-22.04 # older glibc so the packages run on more distros
    steps:
      - uses: actions/checkout@v4
      - name: Check tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$TAG' must look like v0.1.0."; exit 1; }
          want="${TAG#v}"
          have=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          [ "$want" = "$have" ] || { echo "Tag $TAG but src-tauri/tauri.conf.json says $have. Make them match."; exit 1; }
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libsecret-1-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Desktop app (.deb and AppImage)
        run: pnpm tauri build --bundles deb,appimage

      - name: Web server (floww-web)
        run: |
          cargo build --release -p floww-server --bin floww-web
          name="floww-web-${TAG}-linux-x86_64"
          mkdir -p "dist-release/$name"
          cp target/release/floww-web README.md "dist-release/$name/"
          tar -C dist-release -czf "dist-release/$name.tar.gz" "$name"

      - name: Collect files
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/
          cp target/release/bundle/appimage/*.AppImage out/
          cp dist-release/*.tar.gz out/
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - name: Release notes
        run: |
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "Missing $notes. Add release notes for this tag."; exit 1; }
          cp "$notes" notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FloWW ${{ env.TAG }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
