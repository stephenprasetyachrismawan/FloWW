name: Release

# Builds the Linux packages and publishes a GitHub release when:
#  - main gets a version in src-tauri/tauri.conf.json that has no tag yet
#    (bump the version and merge to main to release), or
#  - a tag like v0.1.0 is pushed, or
#  - it is run by hand with a tag name.
# The workflow creates the tag itself when it does not exist.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v0.1.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    name: Decide
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          version=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          case "$GITHUB_EVENT_NAME:$GITHUB_REF_TYPE" in
            workflow_dispatch:*) tag="$INPUT_TAG" ;;
            push:tag) tag="$GITHUB_REF_NAME" ;;
            *) tag="v$version" ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag '$tag' must look like v0.1.0."; exit 1; }
          [ "${tag#v}" = "$version" ] || { echo "Tag $tag but src-tauri/tauri.conf.json says $version. Make them match."; exit 1; }
          release=true
          if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_EVENT_NAME" = push ] \
             && git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release. Bump the version to make a new release."
            release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  linux:
    name: Linux packages
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-22.04 # older glibc so the packages run on more distros
    env:
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev libsecret-1-dev patchelf file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Desktop app (.deb and AppImage)
        run: pnpm tauri build --bundles deb,appimage

      - name: Web server (floww-web)
        run: |
          cargo build --release -p floww-server --bin floww-web
          name="floww-web-${TAG}-linux-x86_64"
          mkdir -p "dist-release/$name"
          cp target/release/floww-web README.md "dist-release/$name/"
          tar -C dist-release -czf "dist-release/$name.tar.gz" "$name"

      - name: Collect files
        run: |
          mkdir -p out
          cp target/release/bundle/deb/*.deb out/
          cp target/release/bundle/appimage/*.AppImage out/
          cp dist-release/*.tar.gz out/
          cd out && sha256sum * > SHA256SUMS.txt && ls -l

      - name: Release notes
        run: |
          notes="docs/release-notes/${TAG}.md"
          [ -f "$notes" ] || { echo "Missing $notes. Add release notes for this tag."; exit 1; }
          cp "$notes" notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FloWW ${{ env.TAG }}
          body_path: notes.md
          files: out/*
          fail_on_unmatched_files: true
