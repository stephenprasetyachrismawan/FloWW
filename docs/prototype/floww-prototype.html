<title>FloWW Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: quiet desktop window; sidebar + one focused column per task. One accent, used for the single primary action. */
:root{
  --bg:#ECECEE; --window:#FAFAFA; --surface:#FFFFFF; --sunken:#F3F3F5; --ink:#1E1E22; --text:#3A3A40; --muted:#74747C; --faint:#A2A2AA; --line:#E6E6EA; --line-2:#D9D9DE;
  --accent:#4743C9; --accent-ink:#FFFFFF;
  --you:#C27A0E; --ai:#4A6FD0; --ok:#3B8A5A; --bad:#C24646; --wait:#A2A2AA;
  --add:#EAF5EE; --del:#FBEDED; --scrim:rgba(20,20,24,.32);
  --shadow:0 1px 2px rgba(20,20,24,.05),0 8px 24px rgba(20,20,24,.06);
  --pop:0 2px 6px rgba(20,20,24,.08),0 16px 40px rgba(20,20,24,.12);
  /* Anthropic fonts come from the viewer's installed copy (local), never bundled */
  --sans:"Anthropic Sans","AnthropicSans","Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:"Anthropic Serif","AnthropicSerif","Source Serif 4",ui-serif,Georgia,serif;
  --mono:"Anthropic Mono","AnthropicMono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F0F12; --window:#161619; --surface:#1C1C20; --sunken:#212126; --ink:#EDEDF0; --text:#CFCFD6; --muted:#9696A0; --faint:#6E6E78; --line:#2A2A30; --line-2:#36363E;
  --accent:#9C99FF; --accent-ink:#141326;
  --you:#E7A84A; --ai:#7FA0F0; --ok:#6CC08D; --bad:#F08A8A; --wait:#6E6E78;
  --add:#17291E; --del:#331C1E; --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --pop:0 2px 6px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0F12; --window:#161619; --surface:#1C1C20; --sunken:#212126; --ink:#EDEDF0; --text:#CFCFD6; --muted:#9696A0; --faint:#6E6E78; --line:#2A2A30; --line-2:#36363E;
  --accent:#9C99FF; --accent-ink:#141326;
  --you:#E7A84A; --ai:#7FA0F0; --ok:#6CC08D; --bad:#F08A8A; --wait:#6E6E78;
  --add:#17291E; --del:#331C1E; --scrim:rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3); --pop:0 2px 6px rgba(0,0,0,.4),0 16px 40px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14.5px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{color:var(--ink);margin:0}
.mono{font-family:var(--mono);font-size:.92em}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.ic{flex:none;vertical-align:middle}
.spin{animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.window{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--window);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.titlebar{display:flex;align-items:center;height:40px;padding:0 14px;border-bottom:1px solid var(--line)}
.titlebar .ttl{flex:1;text-align:center;font-size:12.5px;color:var(--faint)}
.wbtns{display:flex;gap:14px;color:var(--faint);font-size:12px;width:70px;justify-content:flex-end}
.brand{width:70px;font-weight:700;color:var(--ink);font-size:13px;letter-spacing:-.01em}
.shell{flex:1;min-height:0;display:flex}

.side{width:212px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px}
.side .sel-btn{border-color:transparent;background:none;font-weight:600}
.side .sel-btn:hover{background:var(--sunken);border-color:transparent}
.nav{display:flex;flex-direction:column;gap:1px;margin-top:18px}
.nav button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--muted);font-weight:500;text-align:left}
.nav button:hover{color:var(--ink);background:var(--sunken)}
.nav button.on{color:var(--ink);background:var(--sunken);font-weight:600}
.nav .n{margin-left:auto;font-size:12px;color:var(--you);font-weight:600;font-variant-numeric:tabular-nums}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;padding-top:10px}
.side-foot button{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--faint);font-size:13px;text-align:left}
.side-foot button:hover{color:var(--ink);background:var(--sunken)}
.me{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px}
.av{width:24px;height:24px;border-radius:99px;background:var(--sunken);color:var(--muted);display:grid;place-items:center;font-size:10.5px;font-weight:700;flex:none}

.main{flex:1;min-width:0;min-height:0;overflow:auto}
.page{padding:32px 36px 48px;display:flex;flex-direction:column;gap:28px;min-width:0}
.page.narrow{max-width:800px;margin:0 auto;width:100%}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph .t{flex:1;min-width:200px}
.title{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin-top:4px}
.section-t{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:600;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.sm{height:30px;padding:0 11px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.link{color:var(--muted);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.link:hover{color:var(--ink)}
.link.danger:hover{color:var(--bad)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}

.st{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);min-width:0}
.dot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--wait)}
.dot.ai{background:var(--ai);animation:breathe 1.8s ease-in-out infinite}
.dot.you{background:var(--you)}
.dot.ok{background:var(--ok)}
.dot.bad{background:var(--bad)}
.st.you{color:var(--ink);font-weight:600}

.inbox{border-top:1px solid var(--line)}
.inbox-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.inbox-row .what{font-weight:600;color:var(--ink)}
.inbox-row .of{color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.quiet-empty{color:var(--faint);padding:14px 4px;border-bottom:1px solid var(--line)}

.board-wrap{overflow-x:auto;margin:0 -4px;padding:0 4px 8px}
.board{display:grid;grid-template-columns:repeat(6,minmax(210px,1fr));gap:20px;min-width:min-content}
.col-h{display:flex;gap:8px;align-items:baseline;padding:0 2px 10px;font-size:13px;font-weight:600;color:var(--muted)}
.col-h .n{color:var(--faint);font-weight:500}
.col{display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card .ct{font-weight:600;color:var(--ink);line-height:1.4}
.card .cm{font-size:12.5px;color:var(--faint)}
.card .st{margin-top:4px;font-size:12.5px}
.col-empty{height:56px;border-radius:10px;border:1px dashed var(--line)}
.searchbox{display:flex;align-items:center;gap:8px;width:220px;height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--faint)}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink)}
.searchbox:focus-within{border-color:var(--ink)}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:600;font-size:13.5px}
.back:hover{color:var(--ink)}
.meta{color:var(--faint);font-size:13px}
.phases{display:flex;gap:4px;list-style:none;margin:0;padding:0}
.phases li{flex:1;display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--faint);min-width:0}
.phases li::before{content:"";height:3px;border-radius:9px;background:var(--line)}
.phases li.done::before{background:var(--muted)}
.phases li.cur::before{background:var(--accent)}
.phases li.cur{color:var(--ink);font-weight:600}
.phases li.done{color:var(--muted)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line)}
.tabs button{padding:0 0 10px;font-weight:600;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
.now{display:flex;flex-direction:column;gap:22px}
.lead{font-family:var(--serif);font-size:21px;line-height:1.35;color:var(--ink);font-weight:500;text-wrap:balance}
.lead-sub{color:var(--muted);margin-top:6px}
.actions{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.actions .grow{flex:1}
.note-line{padding:12px 14px;border-radius:10px;background:var(--sunken);color:var(--text);font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.note-line .ic{margin-top:3px;color:var(--muted)}
.note-line b{color:var(--ink)}

.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.tl li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:10px;padding:5px 0;font-size:13.5px;color:var(--muted)}
.tl li .m{display:grid;place-items:center;height:21px}
.tl li.run{color:var(--ink);font-weight:600}
.tl li.fail{color:var(--text)}
.tl li.fail .dot{background:var(--bad)}
.tl li.done .dot{background:var(--line-2)}
.tl li.info .dot{background:var(--you)}
.cmd{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--faint);white-space:pre-wrap;overflow-wrap:anywhere;font-weight:400}

.q-count{font-size:13px;color:var(--faint)}
.q{font-family:var(--serif);font-size:24px;line-height:1.3;color:var(--ink);font-weight:500;text-wrap:balance;margin-top:6px}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:18px minmax(0,1fr);gap:14px;padding:16px 6px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.opt:hover{background:var(--sunken)}
.opt .r{width:16px;height:16px;border-radius:99px;border:1.5px solid var(--line-2);margin-top:3px}
.opt:hover .r{border-color:var(--ink)}
.opt .l{font-weight:600;color:var(--ink)}
.opt .w{font-size:13.5px;color:var(--muted);margin-top:2px;display:block}
.sugg{font-size:12px;font-weight:600;color:var(--accent);margin-left:8px}
.other{display:flex;gap:10px}
.other input{flex:1;min-width:0;height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
.other input:focus{outline:0;border-color:var(--ink)}
.answers{display:flex;flex-direction:column;gap:12px;border-left:2px solid var(--line);padding-left:14px}
.answers .aq{font-size:13px;color:var(--muted)}
.answers .aa{color:var(--ink);font-weight:600}
.answers button{font-size:12.5px;color:var(--faint);font-weight:600}
.answers button:hover{color:var(--ink)}
.confirm{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.confirm p{margin:0;color:var(--ink)}
.confirm small{color:var(--faint)}

.doc{max-width:66ch;color:var(--text)}
.doc h2{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.25;letter-spacing:-.01em}
.doc h4{margin:28px 0 8px;font-size:15px}
.doc p{margin:0 0 8px}
.doc ul{padding-left:18px;margin:4px 0 8px}
.doc table{border-collapse:collapse;width:100%;font-size:13.5px;margin:4px 0}
.doc td,.doc th{border-bottom:1px solid var(--line);padding:8px 8px 8px 0;text-align:left;vertical-align:top}
.doc th{font-weight:600;color:var(--muted);font-size:12.5px}
.gwt{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--sunken);border-radius:8px;padding:10px 12px;margin:8px 0;white-space:pre-wrap}
.why{border-left:2px solid var(--accent);padding:2px 0 2px 14px;margin:12px 0;font-size:14px;color:var(--text)}
.why b{color:var(--ink)}
.stickybar{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--window) 30%);padding:28px 0 4px;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.stickybar .grow{flex:1}

.cases{border-top:1px solid var(--line)}
.case{border-bottom:1px solid var(--line);padding:14px 4px}
.case-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.case-h .ttl{flex:1;min-width:200px;text-align:left;color:var(--ink);font-weight:600;display:flex;gap:10px;align-items:center}
.case-h .k{font-size:12px;color:var(--faint);font-weight:500}
.case-body{margin:10px 0 0 26px;display:grid;grid-template-columns:60px minmax(0,1fr);gap:4px 12px;font-size:13.5px}
.case-body dt{color:var(--faint)}
.case-body dd{margin:0}
.case-body textarea{grid-column:1/-1;margin-top:8px}
.mark{width:16px;height:16px;border-radius:99px;border:1.5px solid var(--line-2);display:grid;place-items:center;flex:none;color:#fff}
.mark.pass{background:var(--ok);border-color:var(--ok)}
.mark.fail{background:var(--bad);border-color:var(--bad)}
.pf{display:flex;gap:6px}
.pf button{height:28px;padding:0 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line)}
.pf button:hover{color:var(--ink);border-color:var(--line-2)}
.pf button.on.p{color:var(--ok);border-color:var(--ok)}
.pf button.on.f{color:var(--bad);border-color:var(--bad)}
.pf button[disabled]{opacity:.4;cursor:not-allowed}
.odoo{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.odoo .grow{flex:1;min-width:200px}
.odoo b{color:var(--ink)}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-weight:600;font-size:13.5px;color:var(--ink)}
.hint{font-size:12.5px;color:var(--faint)}
.input{width:100%;height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink)}
textarea.input{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{outline:0;border-color:var(--ink)}
textarea.code{font-family:var(--mono);font-size:13px;min-height:150px}
.input[disabled]{background:var(--sunken);color:var(--muted)}
.form{display:flex;flex-direction:column;gap:18px}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:9px;background:var(--sunken);max-width:100%;flex-wrap:wrap;align-self:flex-start}
.seg button{height:30px;padding:0 12px;border-radius:7px;font-weight:600;color:var(--muted);font-size:13.5px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.check{display:inline-flex;align-items:center;gap:10px;cursor:pointer;color:var(--text)}
.check input{accent-color:var(--accent);width:16px;height:16px}

.sel{position:relative;min-width:0}
.sel-btn{width:100%;height:38px;padding:0 10px 0 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);display:flex;align-items:center;gap:8px;text-align:left;color:var(--ink)}
.sel-btn:hover{border-color:var(--faint)}
.sel-btn[aria-expanded="true"]{border-color:var(--ink)}
.sel-btn .v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sel-btn .ic{color:var(--faint)}
.sel.inline .sel-btn{width:auto;height:28px;border:1px dashed var(--line-2);background:none;padding:0 10px;color:var(--muted);font-weight:600;font-size:13px;border-radius:99px}
.sel.inline .sel-btn:hover{color:var(--ink)}
.sel-pop{position:absolute;z-index:40;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:320px;max-height:280px;overflow:auto;margin:0;padding:6px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop)}
.sel-pop button{width:100%;display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:7px;text-align:left;color:var(--text)}
.sel-pop button:hover,.sel-pop button:focus-visible{background:var(--sunken);color:var(--ink);outline:0}
.sel-pop button .d{display:block;font-size:12px;color:var(--faint)}
.sel-pop button.on{color:var(--ink);font-weight:600}
.sel-pop .chk{width:16px;color:var(--accent);padding-top:1px}
.sel-pop .opt-t{flex:1;min-width:0}

.list{border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line)}
.li .a{color:var(--ink);font-weight:600}
.li .b{color:var(--muted);font-size:13.5px}
.li .c{font-size:12.5px;color:var(--faint);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;background:var(--sunken);color:var(--ink);font-size:13px;font-weight:500}
.chip button{color:var(--faint);display:grid;place-items:center}
.chip button:hover{color:var(--bad)}
.set-group{display:flex;flex-direction:column;gap:18px}
.set-group h3{font-size:16px}
.set-group .gsub{color:var(--muted);font-size:13.5px;margin-top:2px}
.toml{font-family:var(--mono);font-size:12.5px;background:var(--sunken);border-radius:10px;padding:14px;white-space:pre;overflow-x:auto;margin:0;color:var(--text)}

.subnav{display:flex;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.subnav button{padding:0 0 10px;font-weight:600;color:var(--faint);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.subnav button.on{color:var(--ink);border-bottom-color:var(--ink)}
.subnav button:hover{color:var(--ink)}
.subnav .n{color:var(--you);font-size:12px;margin-left:4px}
.know{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:10px}
.know b{font-size:12.5px;color:var(--muted);font-weight:600}
.know ul{margin:6px 0 0;padding-left:16px;font-size:13.5px}
.flow{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px 10px;margin-top:8px;font-size:13.5px}
.flow .s{color:var(--ink);font-weight:500}
.flow .r{color:var(--accent);font-size:12px;font-weight:500;display:block}
.flow .sep{color:var(--faint)}
.graph svg{width:100%;height:auto;display:block;min-width:520px}
.graph .e{stroke:var(--line-2);stroke-width:1.2}
.graph .e.hl{stroke:var(--muted);stroke-width:1.6}
.graph text{fill:var(--muted);font-size:11.5px;font-family:var(--sans)}
.graph g.sel text{fill:var(--ink);font-weight:600}
.graph g{cursor:pointer}
.note-pre{font-family:var(--mono);font-size:12.5px;line-height:1.6;background:var(--sunken);border-radius:10px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px);gap:32px;align-items:start}

.diff{font-family:var(--mono);font-size:12.5px;border-radius:10px;overflow-x:auto;background:var(--sunken)}
.diff .fh{padding:9px 14px;color:var(--muted);border-bottom:1px solid var(--line)}
.diff pre{margin:0;padding:8px 0;min-width:max-content}
.diff span{display:block;padding:0 14px;white-space:pre}
.diff .p{background:var(--add)}.diff .m{background:var(--del)}.diff .h{color:var(--faint)}
.files{font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:5px}
.files div{display:flex;gap:12px}.files .n{color:var(--faint);margin-left:auto;white-space:nowrap}
details.more>summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:13.5px;list-style:none;display:inline-flex;align-items:center;gap:6px}
details.more>summary::-webkit-details-marker{display:none}
details.more[open]>summary .ic{transform:rotate(90deg)}
details.more>div{margin-top:14px}
.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 18px;font-size:13.5px;margin:0}
.kv dt{color:var(--faint)}.kv dd{margin:0;color:var(--text);min-width:0;overflow-wrap:anywhere}
.scroll-x{overflow-x:auto}

.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--window);border:1px solid var(--line);border-radius:14px;box-shadow:var(--pop);width:min(560px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.modal.wide{width:min(640px,100%)}
.m-head{display:flex;align-items:flex-start;gap:12px;padding:24px 26px 6px}
.m-head .t{flex:1}
.m-head h2{font-family:var(--serif);font-weight:600;font-size:23px;line-height:1.25}
.m-step{font-size:12.5px;color:var(--faint);margin-bottom:4px}
.m-body{padding:16px 26px 8px;display:flex;flex-direction:column;gap:18px}
.m-foot{display:flex;gap:18px;align-items:center;padding:18px 26px 24px}
.m-foot .grow{flex:1}
.radio-list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.radio-row{display:grid;grid-template-columns:18px minmax(0,1fr);gap:14px;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.radio-row .r{width:16px;height:16px;border-radius:99px;border:1.5px solid var(--line-2);margin-top:3px;display:grid;place-items:center}
.radio-row.on .r{border-color:var(--accent)}
.radio-row.on .r::after{content:"";width:8px;height:8px;border-radius:99px;background:var(--accent)}
.radio-row .l{font-weight:600;color:var(--ink)}
.radio-row .w{font-size:13.5px;color:var(--muted);display:block}
.picked{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.picked .pr{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.picked .pl{color:var(--muted);font-size:13.5px}
.picked .why2{grid-column:2;font-size:12.5px;color:var(--faint)}

#toast{position:fixed;z-index:80;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100% - 36px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:10px;background:var(--ink);color:var(--window);box-shadow:var(--pop);animation:tin .2s ease-out;font-size:13.5px}
.toast b{display:block;font-weight:600}
.toast small{display:block;opacity:.7}
.toast .dot{margin-top:7px}
@keyframes tin{from{transform:translateY(6px);opacity:0}}

  .title{font-size:24px}
  .searchbox{width:100%}
  .wbtns,.brand{width:auto}
}

const SIM={};
const queueSim=(id,fns)=>{SIM[id]=(SIM[id]||[]).concat(fns);};
setInterval(()=>{let ch=false;for(const id in SIM){const q=SIM[id];if(!q.length){delete SIM[id];continue;}const p=findPrd(id);if(!p||p._paused)continue;q.shift()(p);ch=true;}
 const w=ws();if(w.graph<100){w.graph=Math.min(100,w.graph+20);ch=true;}if(ch)requestRender();},2300);
function grantNext(w){const L=w.lock;L.holder=null;L.what='';while(L.queue.length){const id=L.queue.shift();const p=findPrd(id);if(!p)continue;L.holder=id;const f=p._onGrant;p._onGrant=null;if(f)f(p);notify('Database is free',id+' can continue','ai');break;}}
function release(p){const w=wsOf(p);if(w.lock.holder===p.id)grantNext(w);}
function requestLock(p,what,onGrant){const w=wsOf(p),L=w.lock;
 if(!L.holder||L.holder===p.id){L.holder=p.id;L.what=what;onGrant(p);return true;}
 if(!L.queue.includes(p.id))L.queue.push(p.id);p._onGrant=q=>{L.what=what;onGrant(q);};p.status='wait';p.sub='Waiting for the database';return false;}
function takeOver(p){const w=wsOf(p),L=w.lock,prev=findPrd(L.holder);
 if(prev){prev._paused=true;prev._prevSub=prev.sub;prev.status='wait';prev.sub='Paused while '+p.id+' uses the database';tl(prev,'info','Paused while '+p.id+' used the database');
  prev._onGrant=q=>{q._paused=false;q.status='ai';q.sub=q._prevSub||'Working';tl(q,'run','Continuing');};L.queue.unshift(prev.id);}
 L.queue=L.queue.filter(x=>x!==p.id);L.holder=p.id;const f=p._onGrant;p._onGrant=null;if(f)f(p);}

 '<div class="field"><span class="lbl">Kind</span><div class="seg" id="r-type"><button type="button" class="on" data-a="rtype" data-v="bug">Something is broken</button><button type="button" data-a="rtype" data-v="improve">Make it better</button><button type="button" data-a="rtype" data-v="feature">Something new</button></div></div>'+

 {q:'Which local database should I use for running and testing?',opts:[{l:'gama_dev',rec:true,why:'Restored 2 days ago, gama modules installed.'},{l:'gama_test',why:'Demo data only.'}]}];

 if(o.step===0){sub='FloWW runs every AI step through Claude Code.';b='<div class="radio-list">'+[['sub','My Claude subscription','Uses the login already in Claude Code.'],['router','9router','Routes Claude Code through your 9router.']].map(x=>'<button class="radio-row '+(o.auth===x[0]?'on':'')+'" data-a="ob-auth" data-m="'+x[0]+'"><span class="r"></span><span><span class="l">'+x[1]+'</span><span class="w">'+x[2]+'</span></span></button>').join('')+'</div>'+
  (o.auth==='router'?'<div class="row2"><div class="field"><label for="ob-url">9router address</label><input id="ob-url" class="input" value="http://localhost:20128"></div><div class="field"><label for="ob-tok">API key</label><input id="ob-tok" class="input" type="password" value="sk-9r-demo"><span class="hint">Kept in your system keychain.</span></div></div>':'');}
 if(o.step===1){sub='It also sets up your project. You can change it later.';const list=o.auth==='router'?MODELS.slice(0,3).concat([['qwen3-coder','via 9router']]):MODELS.slice(0,3);
  b='<div class="radio-list">'+list.map(m=>'<button class="radio-row '+(o.model===m[0]?'on':'')+'" data-a="ob-model" data-m="'+m[0]+'"><span class="r"></span><span><span class="l mono" style="font-size:14px">'+m[0]+'</span><span class="w">'+m[1]+'</span></span></button>').join('')+'</div>'+(o.tested?'<span class="st"><i class="dot ok"></i>The model answered in 1.4 s</span>':'<div><button class="link" data-a="ob-test">'+(o.testing?ic('loader',14,'spin')+'Testing…':'Send a test message')+'</button></div>');}
 if(o.step===2){sub='Each repository gets its own board, database and brain.';b='<div class="field"><label for="ob-path">Repository folder</label><div class="other"><input id="ob-path" value="'+esc(o.path)+'" placeholder="~/work/your-repo"><button class="btn" data-a="ob-browse">Browse…</button></div></div>';}
 if(o.step===3){const a=o.agent;sub=a.done?'All set.':'The AI is preparing '+esc(o.path)+'. It asks when something is unclear.';
  b='<ol class="tl">'+a.log.map(e=>'<li class="'+(e[0]==='info'?'info':'done')+'"><span class="m"><i class="dot"></i></span><span>'+esc(e[1])+'</span></li>').join('')+(!a.done&&a.q==null?'<li class="run"><span class="m">'+ic('loader',13,'spin')+'</span><span>Working…</span></li>':'')+'</ol>'+
  (a.q!=null?'<div class="q" style="font-size:20px">'+esc(OB_Q[a.q].q)+'</div><div class="opts">'+OB_Q[a.q].opts.map((x,i)=>'<button class="opt" data-a="obq-pick" data-i="'+i+'"><span class="r"></span><span><span class="l">'+esc(x.l)+(x.rec?'<span class="sugg">Suggested</span>':'')+'</span><span class="w">'+esc(x.why)+'</span></span></button>').join('')+'</div>':'');}
 if(o.step===4){sub='The AI picked these. Change anything that looks off.';const r=o.review;const set=k=>v=>{r[k]=v;};
  b='<div class="picked">'+[['New work starts from',select('rv-base',r.base,['preprod','main'],set('base')),'Created preprod from main because it did not exist.'],['Database',select('rv-db',r.db,['gama_dev','gama_test'],set('db')),'Your answer earlier.'],['Odoo config',select('rv-launch',r.launch,['Odoo 17 (gama)','Odoo shell'],set('launch')),'Matches odoo17.conf.'],['Building skills','<span class="chips"><span class="chip">tdd</span><span class="chip">sdd</span></span>','Found in your Claude Code skills.']].map(x=>'<div class="pr"><span class="pl">'+x[0]+'</span>'+x[1]+'<span class="why2">'+x[2]+'</span></div>').join('')+'</div>';}
 const canNext=o.step===0||(o.step===1&&o.model)||o.step===2||(o.step===3&&o.agent.done);

 return '<div class="modal wide" role="dialog" aria-modal="true" aria-labelledby="ob-h"><div class="m-head"><div class="t"><div class="m-step">'+(o.mode==='first'?'Welcome · ':'')+'Step '+(o.step-first+1)+' of '+(5-first)+'</div><h2 id="ob-h">'+OB_TITLES[o.step]+'</h2><p class="muted" style="margin:6px 0 0">'+sub+'</p></div><button class="iconbtn" data-a="close" aria-label="Close">'+ic('x',16)+'</button></div><div class="m-body">'+b+'</div>'+
 '<div class="m-foot">'+(o.step>first&&o.step!==3?'<button class="link" data-a="ob-back">Back</button>':'')+'<span class="grow"></span>'+(o.step===4?'<button class="btn primary" data-a="ob-finish">Create workspace</button>':(o.step===3&&!o.agent.done)?'':'<button class="btn primary" data-a="ob-next" '+(canNext?'':'disabled')+'>'+(o.step===2?'Set it up':'Continue')+'</button>')+'</div></div>';}
function obRun(){const o=S.ob,a=o.agent;const steps=[['done','Odoo 17 project with 12 modules'],['done','Found odoo-bin and launch.json'],['done','Created a Python environment and installed requirements'],['done','Postgres is running, 4 databases found'],'Q0',['done','Created branch preprod from main'],'Q1',['done','Installed graphify'],['done','Created the shared brain'],['done','Saved settings']];
 if(!S.modal||o.step!==3)return;if(a.i>=steps.length){a.done=true;renderModal();return;}
 const s=steps[a.i];if(typeof s==='string'){a.q=+s.slice(1);renderModal();return;}a.log.push(s);a.i++;renderModal();a.timer=setTimeout(obRun,600);}
function openOb(mode){S.openSel=null;S.ob={mode:mode,step:mode==='add'?2:0,auth:'sub',model:'claude-sonnet-5-5',tested:false,path:'',agent:{log:[],i:0,q:null,done:false},review:{base:'preprod',db:'gama_dev',launch:'Odoo 17 (gama)'}};S.modal='ob';renderModal();render();}

function answer(p,v,other){const g=p.grill,qq=g.qs[g.idx];const rec=(qq.opts.find(o=>o.rec)||{}).l||'';
 DECISIONS.push({prd:p.id,q:qq.q,rec:rec,chose:v,who:'Stephen',why:''});
 if(other)S.uconfirm.push({id:'u'+Date.now(),who:'SP',text:'you prefer “'+v+'” for '+qq.topic.toLowerCase()+'.',src:'your answer in '+p.id,kind:'opinion'});
 g.ans[g.idx]=v;g.ans=g.ans.slice(0,g.idx+1);g.idx++;S.otherOpen=false;tl(p,'info','You answered: '+v);
 if(g.idx>=g.qs.length){g.state='enough';p.action='Write the PRD';}else p.action='Answer '+(g.qs.length-g.idx)+' more question'+(g.qs.length-g.idx>1?'s':'');render();}
function startOdoo(p){requestLock(p,'testing in Odoo',q=>{q.tests.odoo='starting';q.status='ai';q.sub='Starting Odoo';
 queueSim(q.id,[x=>{x.step=12;x.sub='Upgrading '+x.module;tl(x,'done','Started Odoo','odoo-bin -c odoo17.conf -d '+wsOf(x).db+' --http-port '+wsOf(x).port);},
  x=>{x.step=13;tl(x,'done','Upgraded '+x.module,'odoo-bin -d '+wsOf(x).db+' -u '+x.module+' --stop-after-init');x.tests.odoo='on';x.step=14;x.status='needs';x.action='Test it in Odoo';x.sub='Odoo is ready';notify('Odoo is ready',x.id+' · open it and try the cases');}]);});}
function copy(text,msg){try{navigator.clipboard.writeText(text).then(()=>notify(msg,'','ok'),()=>notify('Copy did not work here','Select the text and copy it yourself','bad'));}catch(e){notify('Copy did not work here','Select the text and copy it yourself','bad');}}
function rerender(){(S.modal?renderModal:render)();}
function act(a,el,ev){const p=S.prd?findPrd(S.prd):null;const d=el.dataset;
 switch(a){
 case 'sel-open':S.openSel=S.openSel===d.id?null:d.id;rerender();if(S.openSel){const f=document.querySelector('[data-selroot="'+d.id+'"] .sel-pop button.on')||document.querySelector('[data-selroot="'+d.id+'"] .sel-pop button');if(f)f.focus();}break;
 case 'sel-pick':{const fn=SEL[d.id];S.openSel=null;const wasModal=!!S.modal;if(fn)fn(d.v);if(S.view==='config')refreshToml();if(S.modal&&wasModal)renderModal();else if(!S.modal)render();const b=document.getElementById(d.id);if(b)b.focus();break;}
 case 'nav':go(d.v);break;
 case 'open':S.tab='now';go('prd',d.id);break;
 case 'back':go('board');break;
 case 'tab':S.tab=d.t;S.prdEdit=false;S._keep=false;render();break;
 case 'theme':S.theme=S.theme==='system'?'light':S.theme==='light'?'dark':'system';if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);render();break;
 case 'onboard':openOb('first');break;
 case 'new-req':S.modal='req';S.rtype='bug';renderModal();setTimeout(()=>{const t=document.getElementById('r-title');if(t)t.focus();},30);break;
 case 'close':case 'scrim':if(a==='scrim'&&(!ev||el!==ev.target))return;if(S.ob&&S.ob.agent)clearTimeout(S.ob.agent.timer);S.modal=null;S.openSel=null;renderModal();break;
 case 'rtype':S.rtype=d.v;document.querySelectorAll('#r-type button').forEach(b=>b.classList.toggle('on',b===el));break;
 case 'grill-pick':answer(p,p.grill.qs[p.grill.idx].opts[+d.i].l);break;
 case 'other-open':{S.otherOpen=true;render();const oi=document.getElementById('grill-other');if(oi)oi.focus();break;}
 case 'grill-other':{const v=document.getElementById('grill-other').value.trim();if(v)answer(p,v,true);break;}
 case 'grill-back':{const g=p.grill;g.state='asking';g.idx=Math.max(0,g.idx-1);render();break;}
 case 'grill-edit':{const g=p.grill;g.idx=+d.i;g.state='asking';render();break;}
 case 'toggle-answers':S.showAnswers=!S.showAnswers;render();break;
 case 'grill-enough':{const g=p.grill;g.state='writing';p.status='ai';p.sub='Writing the PRD';tl(p,'run','Writing the PRD');
  queueSim(p.id,[x=>tl(x,'run','Drafting'),x=>{x.grill.state='ready';x.step=7;x.status='needs';x.action='Review the PRD';x.sub='PRD ready';tl(x,'done','PRD written');notify(x.id+': the PRD is ready','Read it and approve');}]);render();break;}
 case 'grill-reopen':p.step=6;p.grill.state='asking';p.grill.idx=Math.min(p.grill.ans.length,p.grill.qs.length-1);p.status='needs';p.action='Answer questions';render();break;
 case 'approve':tl(p,'done','You approved the PRD');p.step=8;p.status='ai';p.sub='Creating the branch';queueSim(p.id,[x=>{tl(x,'done','Created branch feature/'+x.id+'-'+slug(x.title));devScript(x);}]);render();break;
 case 'stop':p._paused=true;tl(p,'info','You paused it');render();break;
 case 'resume':p._paused=false;tl(p,'run','Resumed');render();break;
 case 'hint':S.hint=!S.hint;render();break;
 case 'hint-send':{const v=(document.getElementById('hint-text')||{}).value||'';if(v.trim()){tl(p,'info','Your hint: '+v.trim());tl(p,'run','Trying your hint');}S.hint=false;render();break;}
 case 'cmds':S.cmds=!S.cmds;render();break;
 case 'take':S.confirmTake=d.id;render();break;
 case 'take-no':S.confirmTake=null;render();break;
 case 'take-yes':S.confirmTake=null;takeOver(findPrd(d.id));render();break;
 case 'start-odoo':startOdoo(p);render();break;
 case 'stop-odoo':p.tests.odoo='off';tl(p,'info','Stopped Odoo');release(p);render();break;
 case 'open-odoo':notify('Opening your browser','localhost:'+wsOf(p).port,'ok');break;
 case 'case-open':p.tests.open=p.tests.open===+d.i?-1:+d.i;render();break;
 case 'res':{const c=p.tests.cases[+d.i];c.res=c.res===d.r?null:d.r;render();break;}
 case 'feedback':{const t=p.tests;const items=t.cases.filter(c=>c.res==='fail'||c.note.trim());p.feedback++;
  tl(p,'info','Your feedback: '+items.map(c=>c.title+(c.note?' ('+c.note+')':'')).join('; '));t.odoo='off';release(p);
  p.step=15;p.status='ai';p.sub='Fixing what you found';t.cases.forEach(c=>{if(c.res==='fail')c.res=null;c.note='';});
  queueSim(p.id,[x=>{x.step=9;tl(x,'run','Writing a test for what you found');},x=>tl(x,'done','Fixed it'),x=>runTestsThen(x,'13 of 13')]);render();break;}
 case 'allgood':tl(p,'done','All '+p.tests.cases.length+' cases work');p.tests.odoo='off';release(p);p.step=16;p.status='needs';p.action='Check the commit';p.sub='Commit message drafted';
  p.ship={stage:0,msg:(p.type==='bug'?'[FIX] ':p.type==='feature'?'[ADD] ':'[IMP] ')+p.module+': '+p.title.toLowerCase()+'\n\n'+(p.id==='SP-012'?'Qty dari stock.move yang dibatalkan tidak lagi dihitung, dan\nrantai backorder diikuti sampai selesai.\n':'Sesuai PRD.\n')+'\nPRD: '+p.id,prTitle:(p.type==='bug'?'[FIX] ':'[IMP] ')+p.module+': '+p.title.toLowerCase(),prBody:'PRD: '+p.id+'\n\nSemua test case lulus.'};render();break;
 case 'commit':{const v=document.getElementById('commit-msg');if(v)p.ship.msg=v.value;p.ship.stage=1;p.step=17;p.status='needs';p.action='Push the branch';tl(p,'done','Committed a41c9e2');render();break;}
 case 'push':p.ship.stage=2;p.step=18;p.action='Open a pull request';tl(p,'done','Pushed the branch');render();break;
 case 'create-pr':p.ship.stage=3;p.step=19;p.status='review';p.sub='Pull request open';tl(p,'done','Opened pull request #52');render();break;
 case 'skip-pr':p.ship.stage=3;p.ship.noPR=true;p.step=20;p.status='done';p.sub='Pushed';tl(p,'done','Pushed without a pull request');render();break;
 case 'merge':p.step=20;p.status='done';p.sub='Merged';tl(p,'done','Pull request #52 merged');tl(p,'done','Notes saved to the brain');notify('Pull request merged',p.id+' is done','ok');render();break;
 case 'copy-html':{const dEl=document.querySelector('.doc');copy(dEl?dEl.outerHTML:'','PRD copied as HTML');break;}
 case 'copy-md':copy('# '+p.title,'PRD copied as Markdown');break;
 case 'obsidian':notify('Opening Obsidian','','ok');break;
 case 'prd-edit':S.prdEdit=!S.prdEdit;render();break;
 case 'prd-save':S.prdEdit=false;tl(p,'info','You edited the PRD');render();break;
 case 'sim-dismiss':S.similar[p.id].dismissed=true;render();break;
 case 'btab':S.brainTab=d.t;render();break;
 case 'gnode':S.brainSel=d.n;render();break;
 case 'rule-ok':{const r=RULES.find(x=>x.id===d.id);r.status='active';render();break;}
 case 'uc':{const c=S.uconfirm.find(x=>x.id===d.id);if(!c)break;
  if(d.r==='edit'){S.ucEdit=c.id;render();break;}
  if(d.r==='save'){c.text=document.getElementById('uc-text').value;S.ucEdit=null;}
  if(d.r==='yes'||d.r==='save'){if(c.kind==='opinion')OPINIONS.unshift({who:'Stephen',t:c.text.charAt(0).toUpperCase()+c.text.slice(1),src:c.src.replace('your answer in ','grill ')});else UNDERSTAND[c.who].u.push('Rantai backorder');notify('Remembered','Saved to the shared brain','ok');}
  S.uconfirm=S.uconfirm.filter(x=>x!==c);render();break;}
 case 'sk-rm':S.skills[d.s]=S.skills[d.s].filter(k=>k!==d.k);render();break;
 case 'sk-cancel':S.skillInstall=null;render();break;
 case 'sk-override':S.skillInstall.confirm=true;render();break;
 case 'sk-force':S.extraSkills.push([S.skillInstall.name,'Installed with warnings']);S.skillInstall={stage:'ok',name:S.skillInstall.name,forced:true};render();break;
 case 'files-toggle':S.showFiles=!S.showFiles;break;
 case 'ob-auth':S.ob.auth=d.m;S.ob.tested=false;renderModal();break;
 case 'ob-model':S.ob.model=d.m;S.ob.tested=false;renderModal();break;
 case 'ob-test':S.ob.testing=true;renderModal();setTimeout(()=>{S.ob.testing=false;S.ob.tested=true;renderModal();},900);break;
 case 'ob-browse':S.ob.path='~/work/gama-erp';renderModal();break;
 case 'ob-next':{const o=S.ob;if(o.step===2){const v=document.getElementById('ob-path');o.path=(v&&v.value.trim())||'~/work/gama-erp';}o.step++;renderModal();if(o.step===3){o.agent={log:[],i:0,q:null,done:false};setTimeout(obRun,500);}break;}
 case 'ob-back':S.ob.step--;renderModal();break;
 case 'obq-pick':{const o=S.ob;const v=OB_Q[o.agent.q].opts[+d.i].l;o.agent.log.push(['info','You chose '+v]);if(o.agent.q===1)o.review.db=v;o.agent.q=null;o.agent.i++;renderModal();o.agent.timer=setTimeout(obRun,500);break;}
 case 'ob-finish':{const o=S.ob;const name=o.path.split('/').pop()||'new-repo';const id='w'+Date.now();
  WS[id]={id:id,name:name,path:o.path,db:o.review.db,port:8070,counter:0,graph:10,lock:{holder:null,what:'',queue:[]},prds:[]};
  S.ws=id;S.cfg.name=name;S.cfg.db=o.review.db;S.modal=null;renderModal();go('board');break;}
 }}

document.addEventListener('click',e=>{
 if(S.openSel&&!e.target.closest('[data-selroot]')){S.openSel=null;rerender();if(!e.target.closest('[data-a]'))return;}
 const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')e.preventDefault();act(el.dataset.a,el,e);});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(S.openSel){const id=S.openSel;S.openSel=null;rerender();const b=document.getElementById(id);if(b)b.focus();return;}if(S.modal){S.modal=null;renderModal();}}
 if(S.openSel&&(e.key==='ArrowDown'||e.key==='ArrowUp')){const items=[...document.querySelectorAll('[data-selroot="'+S.openSel+'"] .sel-pop button')];const i=items.indexOf(document.activeElement);const n=items[(i+(e.key==='ArrowDown'?1:-1)+items.length)%items.length];if(n){e.preventDefault();n.focus();}}
 if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-a="gnode"]')){e.preventDefault();act('gnode',e.target);}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='search'){S.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos);}
 if(t.classList.contains('note')){const p=findPrd(S.prd);if(p&&p.tests){p.tests.cases[+t.dataset.i].note=t.value;const fb=document.querySelector('[data-a="feedback"]');if(fb)fb.disabled=!(p.tests.odoo==='on'&&p.tests.cases.some(c=>c.res==='fail'||c.note.trim()));}}
 if(t.dataset.cfg&&t.type!=='checkbox'){S.cfg[t.dataset.cfg]=t.value;refreshToml();}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.cfg&&t.type==='checkbox'){S.cfg[t.dataset.cfg]=t.checked;refreshToml();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
 if(f==='req'){const w=ws();w.counter++;const id='SP-'+String(w.counter).padStart(3,'0');const title=document.getElementById('r-title').value.trim()||'Untitled request';
  const p=mk({id:id,title:title,type:S.rtype||'bug',module:'…',step:1,status:'ai',sub:'Checking the brain',timeline:[{s:'done',t:'Request logged'}]});
  w.prds.unshift(p);S.modal=null;renderModal();
  const words=title.toLowerCase().split(/\W+/).filter(x=>x.length>=5);const sim=w.prds.find(x=>x!==p&&words.some(wd=>x.title.toLowerCase().includes(wd)));
  queueSim(id,[x=>{x.step=2;x.sub='Reading the database';tl(x,'done',sim?'Found something similar: '+sim.id:'Nothing similar in the brain');if(sim)S.similar[x.id]={id:sim.id,title:sim.title};x.module=sim?sim.module:'sale_custom';},
   x=>{x.step=3;x.sub='Reading the code';tl(x,'done','Read '+x.module+' tables from '+w.db);},x=>{x.step=4;x.sub='Writing notes to the brain';tl(x,'done','Read '+x.module+' on '+S.cfg.base);},
   x=>{x.step=5;tl(x,'done','Brain updated');},
   x=>{x.step=6;x.status='needs';x.action='Answer 3 questions';x.sub='Questions ready';x.grill={qs:genericGrill(x.title),idx:0,ans:[],state:'asking'};notify(x.id+' has questions for you',x.title);}]);
  go('board');}
 if(f==='skill'){const src=document.getElementById('sk-src').value.trim();if(!src)return;const name=src.split('/').pop().replace(/\.git$/,'')||src;
  S.skillInstall={stage:'run',name:name,msg:'Installing '+name};render();
  setTimeout(()=>{S.skillInstall.msg='Running the safety scan';render();},900);
  setTimeout(()=>{if(/deploy/i.test(src))S.skillInstall={stage:'blocked',name:name};else{S.skillInstall={stage:'ok',name:name};S.extraSkills.push([name,'Installed just now']);}render();},2000);}});

fromHash();S._keep=false;render();
})();
