<title>FloWW Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: desktop window frame → sidebar nav + content; kanban board, fullscreen PRD detail */
:root{
  --bg:#EFEFF6; --window:#F7F7FB; --surface:#FFFFFF; --surface-2:#F1F0F8; --fg:#1C1A33; --muted:#625F7D; --line:#E1DFEE;
  --accent:#4F46E5; --accent-fg:#FFFFFF; --accent-soft:#ECEBFE; --accent-line:#C9C6FA;
  --ok:#167A3C; --ok-soft:#E2F3E8; --warn:#9A5205; --warn-soft:#FCEFD9; --warn-line:#EDBE73;
  --info:#2459D6; --info-soft:#E4ECFC; --bad:#B42323; --bad-soft:#FBE5E5;
  --code:#F6F5FB; --add:#E3F4E8; --del:#FBE7E7;
  --shadow:0 1px 2px rgba(28,26,51,.06),0 10px 30px rgba(28,26,51,.07);
  /* Anthropic fonts come from the viewer's own installed copy (local), never bundled */
  --font:"Anthropic Sans","AnthropicSans","Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Anthropic Serif","AnthropicSerif","Source Serif 4",ui-serif,Georgia,serif;
  --mono:"Anthropic Mono","AnthropicMono","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0D16; --window:#15141F; --surface:#1C1B29; --surface-2:#252436; --fg:#ECEBF7; --muted:#A3A0BE; --line:#323049;
  --accent:#8C86FF; --accent-fg:#14122A; --accent-soft:#2A2851; --accent-line:#4A46A0;
  --ok:#5BD98A; --ok-soft:#173223; --warn:#F5BE4F; --warn-soft:#3A2C12; --warn-line:#7A5A1E;
  --info:#6FA6FF; --info-soft:#172A47; --bad:#FF8080; --bad-soft:#3D1B1D;
  --code:#191826; --add:#16301F; --del:#3A1A1C; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0D16; --window:#15141F; --surface:#1C1B29; --surface-2:#252436; --fg:#ECEBF7; --muted:#A3A0BE; --line:#323049;
  --accent:#8C86FF; --accent-fg:#14122A; --accent-soft:#2A2851; --accent-line:#4A46A0;
  --ok:#5BD98A; --ok-soft:#173223; --warn:#F5BE4F; --warn-soft:#3A2C12; --warn-line:#7A5A1E;
  --info:#6FA6FF; --info-soft:#172A47; --bad:#FF8080; --bad-soft:#3D1B1D;
  --code:#191826; --add:#16301F; --del:#3A1A1C; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px;display:flex}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
.ic{flex:none;vertical-align:middle}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.45}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}*{transition:none!important;animation:none!important}}

/* window */
.window{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--window);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.titlebar{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.titlebar .ttl{flex:1;text-align:center;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebar .logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:-.02em}
.logo-mark{width:22px;height:22px;border-radius:7px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font-size:12px;font-weight:800}
.wbtns{display:flex;gap:6px}
.wbtns span{width:26px;height:22px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
.shell{flex:1;min-height:0;display:flex}

/* sidebar */
.side{width:236px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:6px;padding:14px 12px;background:var(--window)}
.ws{position:relative}
.ws-btn{width:100%;display:flex;align-items:center;gap:10px;padding:10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);text-align:left}
.ws-btn:hover{border-color:var(--accent-line)}
.ws-av{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:13px;flex:none}
.ws-txt{min-width:0;flex:1}
.ws-name{font-weight:700;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-path{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ws-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:30;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow);padding:6px}
.ws-item{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:7px;border:0;background:none;text-align:left}
.ws-item:hover{background:var(--surface-2)}
.ws-item.add{color:var(--accent);font-weight:600;border-top:1px solid var(--line);border-radius:0 0 7px 7px;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r-sm);border:0;background:none;color:var(--muted);font-weight:600;text-align:left}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;min-width:22px;padding:0 7px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-size:12px;font-weight:700;text-align:center}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px}
.me .ws-av{background:var(--surface-2);color:var(--fg)}
.side-row{display:flex;gap:6px}

/* main */
.main{flex:1;min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:20px 24px 14px}
.head h1{font-family:var(--serif);font-weight:600;font-size:25px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.head .sub{color:var(--muted);font-size:13px}
.head .grow{flex:1}
.content{padding:0 24px 28px;display:flex;flex-direction:column;gap:16px;min-width:0}

/* buttons, chips */
.btn{text-decoration:none;justify-content:center;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent-line)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{background:var(--warn-soft);border-color:var(--warn-line);color:var(--warn)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.ghost{background:none;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--muted)}
.iconbtn:hover{color:var(--fg)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-size:12px;font-weight:600;white-space:nowrap}
.chip.bug{background:var(--bad-soft);color:var(--bad)}
.chip.feature{background:var(--accent-soft);color:var(--accent)}
.chip.improve{background:var(--info-soft);color:var(--info)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ai{background:var(--info-soft);color:var(--info)}
.pill.needs{background:var(--warn-soft);color:var(--warn)}
.pill.wait{background:var(--surface-2);color:var(--muted)}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.seg{display:inline-flex;padding:3px;border-radius:var(--r-sm);background:var(--surface-2);gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

/* board */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;align-items:center;gap:8px;padding:0 12px;height:38px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--muted);min-width:0;flex:0 1 260px}
.search input{border:0;background:none;outline:0;min-width:0;flex:1;color:var(--fg)}
.board-wrap{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(6,minmax(236px,1fr));gap:14px;min-width:min-content}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:280px}
.col-head{display:flex;align-items:baseline;gap:8px;padding:4px 6px 2px}
.col-head b{font-size:14px}
.col-head .n{color:var(--muted);font-size:12px;font-weight:600}
.col-head .rng{margin-left:auto;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.col-empty{color:var(--muted);font-size:13px;padding:16px 8px;text-align:center;border:1.5px dashed var(--line);border-radius:var(--r-sm)}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 13px;display:flex;flex-direction:column;gap:7px;cursor:pointer;text-align:left;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent-line);transform:translateY(-1px)}
.card.needs{border-color:var(--warn-line)}
.card-top{display:flex;align-items:center;gap:8px}
.card-id{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.card-top .chip{margin-left:auto}
.card-title{font-weight:700;line-height:1.35}
.card-mod{font-size:12px;color:var(--muted);font-family:var(--mono)}
.card-step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:5px;border-radius:9px;background:var(--surface-2);overflow:hidden;max-width:80px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:9px}
.card-foot{display:flex;align-items:center;gap:8px}
.card-foot .cost{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card-act{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:13px}
.card .author{width:20px;height:20px;border-radius:6px;background:var(--surface-2);font-size:10px;font-weight:800;display:grid;place-items:center;color:var(--muted)}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-sm);background:var(--info-soft);color:var(--info);font-weight:600}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.ok{background:var(--ok-soft);color:var(--ok)}
.banner .grow{flex:1;min-width:160px}
.banner .btn{color:var(--fg)}

/* detail */
.dhead{display:flex;flex-direction:column;gap:14px;padding:18px 24px 0;border-bottom:1px solid var(--line);background:var(--surface)}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.drow h1{font-family:var(--serif);font-weight:600;font-size:24px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.drow .grow{flex:1}
.stepper{display:flex;align-items:center;gap:6px;overflow-x:auto;padding-bottom:2px}
.stp{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);font-weight:600;white-space:nowrap;font-size:13px;border:0}
.stp .num{width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:var(--surface);font-size:12px;font-weight:800}
.stp.done{background:var(--ok-soft);color:var(--ok)}
.stp.done .num{background:var(--ok);color:var(--surface)}
.stp.cur{background:var(--accent-soft);color:var(--accent)}
.stp.cur .num{background:var(--accent);color:var(--accent-fg)}
.stp-line{width:18px;height:2px;background:var(--line);flex:none}
.substeps{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.substeps span{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:7px;background:var(--surface-2);color:var(--muted)}
.substeps span.done{color:var(--ok)}
.substeps span.cur{background:var(--accent-soft);color:var(--accent);font-weight:700}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-bottom:-1px}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--fg)}
.dbody{padding:22px 24px 32px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin:0 0 4px;font-size:16px;letter-spacing:-.01em}
.panel .lead{color:var(--muted);margin:0 0 14px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,320px);gap:16px;align-items:start}
.grid-half{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.eyebrow{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* timeline */
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;padding:7px 0;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;left:12px;top:30px;bottom:-4px;width:2px;background:var(--line)}
.tl .dot{width:26px;height:26px;border-radius:99px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.tl .done .dot{background:var(--ok-soft);color:var(--ok)}
.tl .run .dot{background:var(--info-soft);color:var(--info)}
.tl .fail .dot{background:var(--bad-soft);color:var(--bad)}
.tl .info .dot{background:var(--accent-soft);color:var(--accent)}
.tl .t{padding-top:3px}
.tl .run .t{font-weight:700}
.tech{display:block;margin-top:4px;font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--code);border:1px solid var(--line);border-radius:7px;padding:6px 9px;overflow-x:auto;white-space:pre}
.ai-now{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-sm);background:var(--info-soft);color:var(--info);font-weight:700;margin-bottom:14px}
.ai-now.wait{background:var(--surface-2);color:var(--muted)}
.ai-now.paused{background:var(--warn-soft);color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row .grow{flex:1}

/* grill */
.grill-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
.grill{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
.grill-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pips{margin-left:auto;display:flex;gap:5px}
.pips i{width:9px;height:9px;border-radius:9px;background:var(--line)}
.pips i.d{background:var(--accent)}
.pips i.c{background:var(--surface);box-shadow:0 0 0 2px var(--accent)}
.grill-q{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.35;margin:0 0 16px;letter-spacing:-.01em;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);text-align:left;width:100%}
.opt:hover{border-color:var(--accent)}
.opt.rec{border-color:var(--accent-line);background:var(--accent-soft)}
.opt-mark{color:var(--accent);padding-top:1px}
.radio{display:block;width:16px;height:16px;border-radius:99px;border:2px solid var(--line)}
.opt-body{display:flex;flex-direction:column;gap:2px}
.opt-label{font-weight:700}
.rec-tag{font-size:11px;font-weight:700;color:var(--accent);margin-left:6px;letter-spacing:.03em;text-transform:uppercase}
.opt-why{font-size:13px;color:var(--muted)}
.opt.other{cursor:default;align-items:center}
.opt.other input{flex:1;min-width:0;border:0;outline:0;background:none}
.grill-foot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.grill-foot .grow{flex:1}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ans .q{font-size:12.5px;color:var(--muted)}
.ans .a{font-weight:700}
.ans button{border:0;background:none;color:var(--accent);font-size:12.5px;font-weight:600;padding:0}

/* prd doc */
.doc{max-width:760px}
.doc h2{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
.doc h4{margin:22px 0 6px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.doc h4 .n{color:var(--accent);font-family:var(--mono);font-size:12px}
.doc p,.doc li{max-width:65ch}
.doc ul{padding-left:20px;margin:6px 0}
.doc table{border-collapse:collapse;width:100%;font-size:13px}
.doc td,.doc th{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.doc th{background:var(--surface-2)}
.gwt{font-family:var(--mono);font-size:12.5px;background:var(--code);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin:6px 0;white-space:pre-wrap}
.doc-meta{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 4px}
.actions-bar{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:2;background:var(--window);padding:6px 0 10px}

/* test */
.test-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:16px;align-items:start}
.case{border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.case.pass{border-color:color-mix(in srgb,var(--ok) 45%,var(--line))}
.case.fail{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.case-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.case-top b{flex:1;min-width:160px}
.kind{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.kind.edge{background:var(--warn-soft);color:var(--warn)}
.case dl{display:grid;grid-template-columns:76px minmax(0,1fr);gap:3px 10px;margin:0;font-size:13px}
.case dt{color:var(--muted)}
.case dd{margin:0}
.pf{display:flex;gap:6px}
.pf button{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:13px}
.pf button.p.on{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.pf button.f.on{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.note{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--surface-2);resize:vertical;min-height:38px}

const SIM={};
const queueSim=(id,fns)=>{SIM[id]=(SIM[id]||[]).concat(fns);};
setInterval(()=>{let ch=false;for(const id in SIM){const q=SIM[id];if(!q.length){delete SIM[id];continue;}const p=findPrd(id);if(!p){delete SIM[id];continue;}if(p._paused)continue;q.shift()(p);ch=true;}
 const w=ws();if(w.graph<100){w.graph=Math.min(100,w.graph+17);ch=true;if(w.graph===100)notify('Code graph ready','graphify built 214 nodes for '+w.name,'ok','brain');}

function grantNext(w){const L=w.lock;L.holder=null;L.what='';while(L.queue.length){const id=L.queue.shift();const p=findPrd(id);if(!p)continue;L.holder=id;L.since='just now';const f=p._onGrant;p._onGrant=null;if(f)f(p);notify('DB is free',id+' now has '+w.db,'info','lock');break;}}
function release(p){const w=wsOf(p);if(w.lock.holder===p.id)grantNext(w);}
function requestLock(p,what,onGrant){const w=wsOf(p),L=w.lock;
 if(!L.holder||L.holder===p.id){L.holder=p.id;L.what=what;L.since='just now';onGrant(p);return true;}
 if(!L.queue.includes(p.id))L.queue.push(p.id);
 p._onGrant=q=>{L.what=what;onGrant(q);};p.status='wait';p.sub='Waiting for DB · held by '+L.holder;return false;}
function takeOver(p){const w=wsOf(p),L=w.lock,prev=findPrd(L.holder);
 if(prev){prev._paused=true;prev._prevSub=prev.sub;prev.status='wait';prev.sub='Paused · '+p.id+' took the DB';tl(prev,'info','Paused: '+p.id+' took over the DB');
  prev._onGrant=q=>{q._paused=false;q.status='ai';q.sub=q._prevSub||'Working';tl(q,'run','Got the DB back, continuing');};L.queue.unshift(prev.id);}
 L.queue=L.queue.filter(x=>x!==p.id);L.holder=p.id;L.since='just now';const f=p._onGrant;p._onGrant=null;if(f)f(p);else L.what='Taken over';
 notify('DB taken over',p.id+' now has '+w.db,'warn','lock');}

 a.log.push(s);a.i++;renderModal();a.timer=setTimeout(obRun,650);}

/* ---------- actions ---------- */
function act(a,el,ev){const p=S.prd?findPrd(S.prd):null;const d=el.dataset;
 switch(a){
 case 'nav':go(d.v);break;
 case 'open':S.tab='now';go('prd',d.id);break;
 case 'back':go('board');break;
 case 'tab':S.tab=d.t;S.prdEdit=false;S._keepScroll=false;render();break;
 case 'ws-menu':S.wsMenu=!S.wsMenu;render();break;
 case 'ws-switch':S.ws=d.w;S.cfg.name=WS[d.w].name;S.cfg.db=WS[d.w].db;S.cfg.port=String(WS[d.w].port);go('board');break;
 case 'ws-add':S.wsMenu=false;openOb('add');break;
 case 'onboard':openOb('first');break;
 case 'theme':S.theme=S.theme==='system'?'light':S.theme==='light'?'dark':'system';if(S.theme==='system')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',S.theme);render();break;
 case 'new-req':S.modal='req';S.rtype='bug';renderModal();setTimeout(()=>{const t=document.getElementById('r-title');if(t)t.focus();},30);break;
 case 'close':case 'scrim':if(a==='scrim'&&(!ev||el!==ev.target))return;if(S.ob&&S.ob.agent)clearTimeout(S.ob.agent.timer);S.modal=null;renderModal();break;
 case 'rtype':S.rtype=d.v;document.querySelectorAll('#r-type button').forEach(b=>b.classList.toggle('on',b===el));break;
 case 'grill-pick':answer(p,p.grill.qs[p.grill.idx].opts[+d.i].l);break;
 case 'grill-other':{const v=document.getElementById('grill-other').value.trim();if(v)answer(p,v,true);break;}
 case 'grill-back':{const g=p.grill;g.state='asking';g.idx=Math.max(0,g.idx-1);render();break;}
 case 'grill-edit':{const g=p.grill;g.idx=+d.i;g.state='asking';render();break;}
 case 'grill-enough':{const g=p.grill;g.state='writing';p.status='ai';p.sub='Writing PRD';tl(p,'run','Writing PRD from '+g.ans.length+' answers');
  queueSim(p.id,[x=>tl(x,'run','Drafting sections 1–10'),x=>{x.grill.state='ready';x.step=7;x.status='needs';x.action='Approve PRD';x.sub='PRD ready for review';tl(x,'done','PRD written: brain/prd/'+x.id+'.md');notify(x.id+' PRD is ready','Review and approve it','warn','needs');}]);render();break;}
 case 'grill-reopen':p.step=6;p.grill=p.grill||{qs:genericGrill(p.title),idx:0,ans:[]};p.grill.state='asking';p.grill.idx=Math.min(p.grill.ans.length,p.grill.qs.length-1);p.status='needs';p.action='Answer questions';p.sub='Grill-me';render();break;
 case 'approve':tl(p,'done','PRD approved by Stephen');p.step=8;p.status='ai';p.sub='Creating branch';S.tab='now';
  queueSim(p.id,[x=>{tl(x,'done','Created branch feature/'+x.id+'-'+slug(x.title)+' and worktree','git worktree add .floww/worktrees/'+x.id+' -b feature/'+x.id+'-'+slug(x.title)+' origin/'+S.cfg.base);devScript(x);}]);render();break;
 case 'stop':p._paused=true;tl(p,'info','Paused by you');render();break;
 case 'resume':p._paused=false;tl(p,'run','Resumed');render();break;
 case 'hint':S.hint=!S.hint;render();break;
 case 'hint-send':{const v=(document.getElementById('hint-text')||{}).value||'';if(v.trim()){tl(p,'info','Hint from you: '+v.trim());tl(p,'run','Using your hint');}S.hint=false;render();break;}
 case 'take':S.confirmTake=d.id;render();break;
 case 'take-no':S.confirmTake=null;render();break;
 case 'take-yes':S.confirmTake=null;takeOver(findPrd(d.id));render();break;
 case 'start-odoo':startOdoo(p);render();break;
 case 'stop-odoo':p.tests.odoo='off';p.status='needs';p.action='Start testing';tl(p,'info','Stopped Odoo and freed the DB');release(p);render();break;
 case 'open-odoo':notify('Opening browser','http://localhost:'+wsOf(p).port+'/odoo · db '+wsOf(p).db,'info','info');break;
 case 'res':{const c=p.tests.cases[+d.i];c.res=c.res===d.r?null:d.r;p.sub='Human test · '+p.tests.cases.filter(x=>x.res).length+' of '+p.tests.cases.length+' checked';render();break;}
 case 'feedback':{const t=p.tests;const items=t.cases.filter(c=>c.res==='fail'||c.note.trim());p.feedback++;
  tl(p,'info','Feedback round '+p.feedback+': '+items.map(c=>c.title+(c.note?' ('+c.note+')':'')).join('; '));t.odoo='off';release(p);
  p.step=15;p.status='ai';p.sub='Sending feedback to AI';t.cases.forEach(c=>{if(c.res==='fail')c.res=null;c.note='';});
  queueSim(p.id,[x=>{x.step=9;x.sub='Fixing feedback · try 1/5';tl(x,'run','Writing a failing test for the reported case');},x=>tl(x,'done','Fixed and added test for feedback round '+x.feedback),x=>runTestsThen(x,'13/13')]);render();break;}
 case 'allgood':tl(p,'done','Human test passed ('+p.tests.cases.length+' cases)');p.tests.odoo='off';release(p);p.step=16;p.status='needs';p.action='Review commit';p.sub='Commit message drafted';
  p.ship={stage:0,msg:(p.type==='bug'?'[FIX] ':p.type==='feature'?'[ADD] ':'[IMP] ')+p.module+': '+p.title.toLowerCase()+'\n\n'+(p.id==='SP-012'?'Qty dari stock.move yang dibatalkan tidak lagi dihitung saat\nmembuat invoice, dan rantai backorder diikuti sampai selesai.\n':'Perubahan sesuai PRD.\n')+'\nPRD: '+p.id,prTitle:(p.type==='bug'?'[FIX] ':'[IMP] ')+p.module+': '+p.title.toLowerCase(),prBody:'PRD: '+p.id+'\n\nHuman test lulus.'};notify(p.id+' is ready to ship','Review the commit message','warn','needs');render();break;
 case 'commit':{const v=document.getElementById('commit-msg');if(v)p.ship.msg=v.value;p.ship.stage=1;p.step=17;p.sub='Committed · ready to push';tl(p,'done','Committed a41c9e2','git commit -F .floww/runs/'+p.id+'-msg.txt');render();break;}
 case 'push':p.ship.stage=2;p.step=18;p.sub='Pushed · PR optional';tl(p,'done','Pushed feature/'+p.id+'-'+slug(p.title),'git push -u origin feature/'+p.id+'-'+slug(p.title));p.action='Create PR (optional)';render();break;
 case 'create-pr':p.ship.stage=3;p.step=19;p.status='review';p.sub='PR #52 open · waiting for review';tl(p,'done','Opened PR #52 into '+S.cfg.base);render();break;
 case 'skip-pr':p.ship.stage=3;p.ship.noPR=true;p.step=20;p.status='done';p.sub='Pushed without PR';tl(p,'done','Pushed without a pull request');render();break;
 case 'merge':p.step=20;p.status='done';p.sub='PR #52 merged into '+S.cfg.base;tl(p,'done','PR #52 merged');tl(p,'done','Logged to brain/changes/'+p.id+'.md');tl(p,'done','Removed worktree .floww/worktrees/'+p.id);notify('PR merged',p.id+' · brain updated','ok','merge');render();break;
 case 'copy-html':copy(document.querySelector('.doc')?document.querySelector('.doc').outerHTML:'','PRD HTML copied');break;
 case 'copy-md':copy(prdMarkdown(p),'PRD markdown copied');break;
 case 'obsidian':notify('Opening Obsidian','obsidian://open?vault='+ws().name+'-brain'+(p?'&file=prd/'+p.id:''),'info','brain');break;
 case 'prd-edit':S.prdEdit=!S.prdEdit;render();break;
 case 'prd-save':S.prdEdit=false;tl(p,'info','PRD edited by you, HTML regenerated');notify('PRD saved','HTML regenerated from markdown','ok','brain');render();break;
 case 'sim-open':S.tab='now';go('prd',d.id);break;
 case 'sim-dismiss':S.similar[p.id].dismissed=true;render();break;
 case 'gnode':S.brainSel=d.n;render();break;
 case 'btab':S.brainTab=d.t;render();break;
 case 'goto-under':S.brainTab='understanding';go('brain');break;
 case 'rule-ok':{const r=RULES.find(x=>x.id===d.id);r.status='active';notify('Rule confirmed','rules/'+r.id+'.md · committed to floww/brain','ok','brain');render();break;}
 case 'uc':{const c=S.uconfirm.find(x=>x.id===d.id);if(!c)break;
  if(d.r==='edit'){S.ucEdit=c.id;render();break;}
  if(d.r==='save'){c.text=document.getElementById('uc-text').value;S.ucEdit=null;}
  if(d.r==='yes'||d.r==='save'){if(c.kind==='opinion')OPINIONS.unshift({who:c.who,t:c.text.replace(/^kamu /i,''),src:c.src,confirmed:true});else UNDERSTAND[c.who].u.push(c.text.replace(/^Kamu belum yakin /i,'').replace(/\.$/,''));
   notify('Saved to brain',c.kind==='opinion'?'opinions/ · '+c.who:'understanding/people/'+c.who+'.md','ok','brain');}
  S.uconfirm=S.uconfirm.filter(x=>x!==c);render();break;}
 case 'brain-sync':notify('Brain synced','Pulled 2 notes from Andi R., pushed 3','ok','brain');break;
 case 'sk-rm':S.skills[d.s]=S.skills[d.s].filter(k=>k!==d.k);render();break;
 case 'sk-cancel':S.skillInstall=null;render();break;
 case 'sk-override':S.skillInstall.confirm=true;render();break;
 case 'sk-force':S.extraSkills=(S.extraSkills||[]).concat([[S.skillInstall.name,'~/.claude/skills','forced','Installed with override']]);S.skillInstall={stage:'ok',name:S.skillInstall.name,forced:true};render();break;
 case 'ob-auth':S.ob.auth=d.m;S.ob.tested=false;S.ob.model=d.m==='router'?'claude-sonnet-5-5':'claude-sonnet-5-5';renderModal();break;
 case 'ob-model':S.ob.model=d.m;S.ob.tested=false;renderModal();break;
 case 'ob-test':S.ob.testing=true;renderModal();setTimeout(()=>{S.ob.testing=false;S.ob.tested=true;renderModal();},900);break;
 case 'ob-browse':S.ob.path='~/work/gama-erp';renderModal();break;
 case 'ob-next':{const o=S.ob;if(o.step===1){const c=document.getElementById('ob-custom');if(c&&c.value.trim())o.model=c.value.trim();}if(o.step===2){const v=document.getElementById('ob-path');if(v)o.path=v.value.trim()||o.path;if(!o.path)return;}
  o.step++;renderModal();if(o.step===3){o.agent={log:[],i:0,q:null,done:false};setTimeout(obRun,500);}break;}
 case 'ob-back':S.ob.step--;renderModal();break;
 case 'obq-pick':case 'obq-other':{const o=S.ob;const v=a==='obq-other'?(document.getElementById('obq-other').value.trim()):OB_Q[o.agent.q].opts[+d.i].l;if(!v)return;
  o.agent.log.push(['info','You chose: '+v]);if(o.agent.q===1)o.review.db=v;o.agent.q=null;o.agent.i++;renderModal();o.agent.timer=setTimeout(obRun,500);break;}
 case 'ob-finish':{const o=S.ob;const name=(o.path.split('/').pop()||'new-repo');const id='w'+Date.now();
  WS[id]={id:id,name:name,path:o.path,db:(document.getElementById('rv-db')||{}).value||'gama_dev',port:8070,counter:0,graph:4,lock:{holder:null,what:'',since:'',queue:[]},prds:[]};
  S.ws=id;S.cfg.name=name;S.cfg.db=WS[id].db;S.cfg.port='8070';S.cfg.launch='Odoo 17 (acme)';S.modal=null;renderModal();go('board');notify('Workspace ready',name+' · graph is building in the background','ok','brain');break;}
 }}
function answer(p,v,other){const g=p.grill;const qq=g.qs[g.idx];const rec=(qq.opts.find(o=>o.rec)||{}).l||'';
 DECISIONS.push({prd:p.id,q:qq.q,rec:rec,chose:v,who:'SP',why:'',date:'today'});
 if(other){const c={id:'u'+Date.now(),who:'SP',text:'kamu punya pendapat sendiri soal "'+qq.topic+'": '+v+'.',src:'Jawaban Other di grill '+p.id,kind:'opinion'};S.uconfirm.push(c);notify('Saved to brain: decision','AI wants to confirm one thing about you','info','brain');}g.ans[g.idx]=v;g.ans=g.ans.slice(0,g.idx+1);g.idx++;tl(p,'info','Answered Q'+g.idx+': '+v);
 if(g.idx>=g.qs.length){g.state='enough';p.sub='Grill-me · all answered';}else p.sub='Grill-me · '+g.idx+' of '+g.qs.length+' answered';p.action=g.idx>=g.qs.length?'Write the PRD':'Answer '+(g.qs.length-g.idx)+' questions';render();}
function startOdoo(p){requestLock(p,'Human test (Odoo running)',q=>{q.tests.odoo='starting';q.status='ai';q.sub='Starting Odoo';
 queueSim(q.id,[x=>{x.step=12;x.sub='Starting Odoo';tl(x,'done','Started Odoo on localhost:'+wsOf(x).port,'odoo-bin -c odoo17.conf -d '+wsOf(x).db+' --http-port '+wsOf(x).port);},
  x=>{x.step=13;tl(x,'done','Upgraded '+x.module,'odoo-bin -d '+wsOf(x).db+' -u '+x.module+' --stop-after-init');x.tests.odoo='on';x.step=14;x.status='needs';x.action='Run test cases';x.sub='Human test · 0 of '+x.tests.cases.length+' checked';notify(x.id+': Odoo is ready','Open Odoo and run the test cases','warn','needs');}]);});
 if(p.status==='wait'){p.tests.odoo='queued';tl(p,'info','Queued for DB ('+wsOf(p).lock.holder+' has it)');}}
function openOb(mode){S.ob={mode:mode,step:mode==='add'?2:0,auth:'sub',model:'claude-sonnet-5-5',tested:false,path:'',agent:{log:[],i:0,q:null,done:false},review:{db:'gama_dev'}};S.modal='ob';renderModal();}
function copy(text,msg){try{navigator.clipboard.writeText(text).then(()=>notify(msg,'Ready to paste','ok','info'),()=>notify('Copy blocked here','Select the text and copy it manually','bad','fail'));}catch(e){notify('Copy blocked here','Select the text and copy it manually','bad','fail');}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;
 if(el.tagName==='A')e.preventDefault();act(el.dataset.a,el,e);});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card,[data-a="gnode"]')){e.preventDefault();act(e.target.dataset.a,e.target);}
 if(e.key==='Escape'&&S.modal){S.modal=null;renderModal();}});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='search'){S.q=t.value;const pos=t.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(pos,pos);}
 if(t.classList.contains('note')){const p=findPrd(S.prd);if(p&&p.tests){p.tests.cases[+t.dataset.i].note=t.value;const fb=document.querySelector('[data-a="feedback"]');if(fb)fb.disabled=!(p.tests.odoo==='on'&&p.tests.cases.some(c=>c.res==='fail'||c.note.trim()));}}
 if(t.dataset.cfg&&t.type!=='checkbox'){S.cfg[t.dataset.cfg]=t.value;refreshToml();}});
function refreshToml(){const a=document.getElementById('toml'),b=document.getElementById('toml-local');if(a)a.innerHTML=tomlTeam();if(b)b.innerHTML=tomlLocal();}
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='needs'){S.needsOnly=t.checked;render();}
 if(t.id==='tech'){S.tech=t.checked;render();}
 if(t.dataset.cfg){S.cfg[t.dataset.cfg]=t.type==='checkbox'?t.checked:t.value;refreshToml();}
 if(t.dataset.skadd&&t.value){S.skills[t.dataset.skadd].push(t.value);render();}});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target.dataset.form;
 if(f==='req'){const w=ws();w.counter++;const id='SP-'+String(w.counter).padStart(3,'0');const title=document.getElementById('r-title').value.trim()||'Untitled request';
  const p=mk({id:id,title:title,type:S.rtype||'bug',module:'—',step:1,status:'ai',sub:'Checking brain',prio:document.getElementById('r-prio').value,timeline:[{s:'done',t:'Request logged by Stephen (reported by '+document.getElementById('r-rep').value+')'}]});
  w.prds.unshift(p);S.modal=null;renderModal();
  const words=title.toLowerCase().split(/\W+/).filter(x=>x.length>=5);const sim=w.prds.find(x=>x!==p&&words.some(wd=>x.title.toLowerCase().includes(wd)));
  queueSim(id,[x=>{x.step=2;tl(x,'done','Checked brain: '+(sim?'found similar '+sim.id:'no similar PRD'));if(sim){S.similar[x.id]={id:sim.id,title:sim.title};}x.module=sim?sim.module:'sale_custom';},
   x=>{x.step=3;tl(x,'done','Read local DB '+w.db+': '+x.module+' models');},x=>{x.step=4;tl(x,'done','Read '+x.module+' on '+S.cfg.base);},
   x=>{x.step=5;tl(x,'done','Updated brain: requirements/'+x.id+'.md');},
   x=>{x.step=6;x.status='needs';x.action='Answer 3 questions';x.sub='Grill-me · 0 of 3 answered';x.grill={qs:genericGrill(x.title),idx:0,ans:[],state:'asking'};notify(x.id+' has questions for you',x.title,'warn','needs');}]);
  notify('Request '+id+' created','AI is checking the brain, database and code','info','info');go('board');}
 if(f==='skill'){const src=document.getElementById('sk-src').value.trim();if(!src)return;const name=src.split('/').pop().replace(/\.git$/,'')||src;
  S.skillInstall={stage:'run',name:name,msg:'Installing '+name+' into ~/.claude/skills'};render();
  setTimeout(()=>{S.skillInstall.msg='Scanning '+name+' with skillspector';render();},900);
  setTimeout(()=>{if(/deploy/i.test(src))S.skillInstall={stage:'blocked',name:name};else{S.skillInstall={stage:'ok',name:name};S.extraSkills=(S.extraSkills||[]).concat([[name,'~/.claude/skills','clean','Installed just now']]);}render();},2000);}});

fromHash();S._keepScroll=false;render();
})();
</script>
